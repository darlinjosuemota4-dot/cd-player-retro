<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Windows Media Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #1a5c1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }

    .mobile-window {
      background: #144d14;
      border: 2px solid #2d882d;
      border-radius: 8px;
      width: 100%;
      max-width: 380px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #cccccc;
      margin-bottom: 8px;
    }

    .media-box {
      background: #000;
      border: 1px solid #2d882d;
      border-radius: 4px;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .album-art {
      width: 70px;
      height: 70px;
      background: #222;
      border: 1px solid #00ff00;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .track-artist {
      font-size: 12px;
      color: #b3ffb3;
    }

    /* Lista de reproducción táctil */
    .playlist-container {
      background: #000;
      border: 1px solid #2d882d;
      height: 180px;
      border-radius: 4px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .playlist-item {
      padding: 8px 10px;
      font-size: 13px;
      border-bottom: 1px solid #111;
      color: #00ff00;
      cursor: pointer;
    }

    .playlist-item.active {
      background: #144d14;
      color: #ffffff;
      font-weight: bold;
    }

    /* Botones grandes aptos para el dedo */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      gap: 5px;
    }

    .btn {
      background: #2d882d;
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      flex: 1;
      cursor: pointer;
      text-align: center;
    }

    .btn:active {
      background: #144d14;
    }

    #file-input { display: none; }
  </style>
</head>
<body>

  <div class="mobile-window">
    <div class="top-bar">
      <span id="status-text">▶ Stopped</span>
      <span id="counter-text">0/0</span>
    </div>

    <div class="media-box">
      <div class="album-art">💿</div>
      <div class="track-info">
        <div class="track-title" id="track-name">No track loaded</div>
        <div class="track-artist">Windows Media Mobile</div>
      </div>
    </div>

    <div class="playlist-container" id="playlist-box">
      <!-- Las canciones se cargaran aqui -->
    </div>

    <div class="controls-bar">
      <button class="btn" onclick="document.getElementById('file-input').click()">📁</button>
      <button class="btn" onclick="prevTrack()">◄◄</button>
      <button class="btn" onclick="togglePlay()" id="play-pause-btn">►</button>
      <button class="btn" onclick="nextTrack()">►►</button>
    </div>
  </div>

  <input type="file" id="file-input" accept="audio/*" multiple>
  <audio id="audio-player"></audio>

  <script>
    const audio = document.getElementById('audio-player');
    const fileInput = document.getElementById('file-input');
    const trackName = document.getElementById('track-name');
    const statusText = document.getElementById('status-text');
    const counterText = document.getElementById('counter-text');
    const playlistBox = document.getElementById('playlist-box');
    const playPauseBtn = document.getElementById('play-pause-btn');

    let playlist = [];
    let currentIndex = 0;

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) {
        playlist = files;
        currentIndex = 0;
        updatePlaylistUI();
        loadTrack(currentIndex);
      }
    });

    function updatePlaylistUI() {
      playlistBox.innerHTML = '';
      playlist.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        div.textContent = `${index + 1}. ${file.name.replace(/\.[^/.]+$/, "")}`;
        div.onclick = () => {
          currentIndex = index;
          loadTrack(currentIndex);
        };
        playlistBox.appendChild(div);
      });
    }

    function loadTrack(index) {
      if (playlist.length === 0) return;
      const file = playlist[index];
      audio.src = URL.createObjectURL(file);
      trackName.textContent = file.name.replace(/\.[^/.]+$/, "");
      counterText.textContent = `${index + 1}/${playlist.length}`;
      
      audio.play();
      statusText.textContent = "▶ Playing";
      playPauseBtn.textContent = "❚❚";
      
      updatePlaylistUI();
    }

    function togglePlay() {
      if (playlist.length === 0) {
        document.getElementById('file-input').click();
        return;
      }
      if (audio.paused) {
        audio.play();
        statusText.textContent = "▶ Playing";
        playPauseBtn.textContent = "❚❚";
      } else {
        audio.pause();
        statusText.textContent = "❚❚ Paused";
        playPauseBtn.textContent = "►";
      }
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
    }

    audio.onended = () => {
      nextTrack();
    };
  </script>
</body>
</html>
